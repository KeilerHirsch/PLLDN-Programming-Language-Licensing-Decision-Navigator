name: Manual Node 24 workload evidence
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact current protected main commit to measure
        type: string
        required: true
permissions:
  contents: read
jobs:
  measure:
    name: Pinned Node JSON workload
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BENCHMARK_SOURCE_SHA: ${{ inputs.target_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Reject old or mismatched main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BENCHMARK_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$BENCHMARK_SOURCE_SHA"
          test "$GITHUB_SHA" = "$BENCHMARK_SOURCE_SHA"
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$BENCHMARK_SOURCE_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Assert exact Node runtime and deterministic fixture
        run: |
          node -e 'if (process.version !== "v24.15.0") process.exit(1)'
          node tools/benchmark-node24-json-v01.ts --self-test
      - name: Record bounded raw measurement
        run: node tools/benchmark-node24-json-v01.ts --output reports/node24-json-roundtrip-v0.1.json
      - name: Verify recorded output before upload
        run: node tools/validate-node24-benchmark.ts reports/node24-json-roundtrip-v0.1.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node24-json-workload-${{ inputs.target_sha }}
          path: reports/node24-json-roundtrip-v0.1.json
          retention-days: 90
          if-no-files-found: error
