name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * 1"
permissions:
  contents: read
jobs:
  security:
    name: Supply chain and secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=low
      - name: Run pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .
      - name: Generate dependency inventory
        run: |
          mkdir -p reports
          npm sbom --sbom-format cyclonedx > reports/sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-inventory
          path: reports/sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
