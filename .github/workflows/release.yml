name: Release Beta 1
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact protected-main commit SHA to release
        required: true
        type: string
      confirmation:
        description: Type v0.0.1-beta.1 to authorize the prerelease
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-v0.0.1-beta.1
  cancel-in-progress: false
jobs:
  build:
    name: Build verified Beta 1 handoff
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - name: Confirm release identity
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "v0.0.1-beta.1"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require current protected main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
          actual="$(git rev-parse refs/remotes/origin/main)"
          test "$actual" = "$TARGET_SHA"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run evidence
      - run: npm audit --audit-level=low
      - name: Run pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "${RUNNER_TEMP}/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "${RUNNER_TEMP}/gitleaks.tar.gz" -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" git --redact --no-banner .
      - name: Resolve release epoch
        shell: bash
        run: |
          set -euo pipefail
          epoch_seconds="$(git show -s --format=%ct "$TARGET_SHA")"
          release_epoch="$(date -u -d "@$epoch_seconds" +'%Y-%m-%dT%H:%M:%S.000Z')"
          echo "RELEASE_EPOCH=$release_epoch" >> "$GITHUB_ENV"
      - name: Build release twice
        shell: bash
        run: |
          set -euo pipefail
          npm run build:release -- --target-sha "$TARGET_SHA" --epoch "$RELEASE_EPOCH"
          mv .build/release .build/release-first
          npm run build:release -- --target-sha "$TARGET_SHA" --epoch "$RELEASE_EPOCH"
          diff -r .build/release-first .build/release
          rm -rf .build/release-first
      - name: Upload verified release handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-release-handoff
          path: .build/release
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Publish verified Beta 1 prerelease
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ inputs.target_sha }}
      TAG: v0.0.1-beta.1
    steps:
      - name: Download verified release handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: beta-release-handoff
          path: release-handoff
      - name: Verify handoff bytes
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-handoff/internal/publication-manifest.json"
          test -f "$manifest"
          test "$(jq -r '.release.tag' "$manifest")" = "$TAG"
          test "$(jq -r '.target_commit_sha' "$manifest")" = "$TARGET_SHA"
          jq -r '.assets[] | "\(.sha256)  release-handoff/public/\(.name)"' "$manifest" | sha256sum --check --strict
          find release-handoff/public -maxdepth 1 -type f -printf '%f\n' | sort > actual-assets.txt
          jq -r '.assets[].name' "$manifest" | sort > expected-assets.txt
          cmp actual-assets.txt expected-assets.txt
          jq -j '.release_notes.text' "$manifest" > release-notes.md
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists" >&2
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists" >&2
            exit 1
          fi
      - name: Create draft prerelease
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-handoff/internal/publication-manifest.json"
          title="$(jq -r '.release.title' "$manifest")"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --prerelease --title "$title" --notes-file release-notes.md --target "$TARGET_SHA"
          gh release upload "$TAG" release-handoff/public/* --repo "$GITHUB_REPOSITORY"
      - name: Verify GitHub draft asset digests
        shell: bash
        run: |
          set -euo pipefail
          manifest="release-handoff/internal/publication-manifest.json"
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          release_id="$(jq -r '.id' <<<"$release_json")"
          test "$(jq -r '.draft' <<<"$release_json")" = "true"
          test "$(jq -r '.prerelease' <<<"$release_json")" = "true"
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$TARGET_SHA"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets" --paginate > release-assets.json
          test "$(jq 'length' release-assets.json)" = "6"
          while IFS=$'\t' read -r name expected; do
            actual="$(jq -r --arg name "$name" '.[] | select(.name == $name) | .digest' release-assets.json)"
            test "$actual" = "sha256:$expected"
          done < <(jq -r '.assets[] | [.name, .sha256] | @tsv' "$manifest")
          echo "RELEASE_ID=$release_id" >> "$GITHUB_ENV"
      - name: Publish verified prerelease
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -F prerelease=true >/dev/null
      - name: Cleanup unpublished draft on failure only
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null)"; then
            draft="$(jq -r '.draft' <<<"$release_json")"
            prerelease="$(jq -r '.prerelease' <<<"$release_json")"
            target="$(jq -r '.target_commitish' <<<"$release_json")"
            if [ "$draft" = "true" ] && [ "$prerelease" = "true" ] && [ "$target" = "$TARGET_SHA" ]; then
              gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            else
              echo "Refusing cleanup because release is not the expected unpublished draft" >&2
              exit 1
            fi
          fi
