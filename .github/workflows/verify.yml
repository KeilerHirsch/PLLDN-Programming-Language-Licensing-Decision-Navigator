name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: npm run evidence
      - run: node tools/replay-fixture.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.os }}
          path: reports/
          if-no-files-found: error
          retention-days: 30
  browser:
    name: Browser smoke (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.12.1 --ignore-scripts
      - run: npm ci --ignore-scripts
      - name: Run Chromium smoke on desktop and mobile viewports
        run: |
          command -v google-chrome
          npm run test:browser
  replay:
    name: Cross-platform replay
    needs: [verify, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful verification on every platform
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$VERIFY_RESULT" = "success"
          test "$BROWSER_RESULT" = "success"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: verification-*
          path: evidence
      - name: Compare the same synthetic snapshot bytes
        run: cmp evidence/verification-ubuntu-24.04/fixture-snapshot.json evidence/verification-windows-2025/fixture-snapshot.json
